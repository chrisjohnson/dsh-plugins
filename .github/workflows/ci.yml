name: CI
# Three jobs, cheapest first. The point of the split is that a failure tells you
# which layer broke: the contract (verify), the logic (tests), or reality
# (compose-smoke).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No `npm ci`: this repository has no dependencies to install. Everything runs
      # on Node's own modules, which is what lets CI (and a bare clone) work without
      # a registry round-trip.
      - name: Release contract
        run: node scripts/verify.mjs --verbose
      - name: Rules of Hooks gate (browser halves)
        run: node scripts/check-plugin-hooks.mjs

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.9.0', '22', '24']
    name: tests (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # dsh-kanban needs node:sqlite (node >=22.5, its engines range), so the
      # 20.9 floor leg covers every other package.
      - run: |
          files=$(ls packages/*/test/*.test.mjs)
          if [ "${{ matrix.node }}" = "20.9.0" ]; then files=$(echo "$files" | grep -v '^packages/kanban/'); fi
          node --test $files scripts/test/*.test.mjs

  compose:
    # The expensive, interesting one: installs each package into a throwaway
    # profile with the real CLI, imports it, and asserts its config layer lands.
    # Needs an actual harness installation, so it is a separate job (and can be
    # skipped on forks that cannot install from the registry).
    runs-on: ubuntu-latest
    needs: [contract, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Pinned to the harness line these packages' peer ranges target, not
      # `latest`: dsh checks every bundle's @deepseek-ai/dsh* peer ranges at
      # install and at boot, so smoking against whatever `latest` happens to be
      # tests a pairing nobody declared. The harness brings its own Cordis
      # (`@deepseek-ai/cordis` ~4.0.4 on 0.2.x); nothing here pins it. A repository
      # variable DSH_SMOKE_VERSION overrides the default without a commit.
      - name: Install the harness
        env:
          DSH_SMOKE_VERSION: ${{ vars.DSH_SMOKE_VERSION || '0.2.0-rc.2' }}
        run: |
          npm install --no-audit --no-fund --no-save "@deepseek-ai/dsh@${DSH_SMOKE_VERSION}"
          node -p "'dsh ' + require('@deepseek-ai/dsh/package.json').version + ', cordis ' + require('@deepseek-ai/cordis/package.json').version"
      # `dsh plugin add` shells out to pnpm - npm's resolver backtracks
      # exponentially on the harness's cyclic peer dependencies - and
      # actions/setup-node does not put pnpm on PATH, so without this every
      # package fails the smoke with "pnpm was not found" (exit 127) no matter
      # what changed. Pinned exactly on purpose: this repository has no
      # dependencies of its own to lock, so the package manager version is the
      # one variable CI cannot read back out of a lockfile.
      - name: Provide pnpm for the plugin CLI
        run: |
          npm install --global --no-audit --no-fund pnpm@12.9.0
          pnpm --version
      - name: Tool output through the harness's own validation
        run: node --test packages/model-switch/test/registry.test.mjs
      - name: Composition smoke
        run: node scripts/compose-smoke.mjs
      - name: Leave the composed config behind on failure
        if: failure()
        run: |
          for f in .lab/*/dump-config.txt; do [ -e "$f" ] && cp "$f" .; done || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: composed-configs
          path: dump-config*.txt
          if-no-files-found: ignore
