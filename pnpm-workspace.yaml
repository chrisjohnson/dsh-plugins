# This repo is a pnpm workspace, but nothing in it needs installing to test.
#
# Every plugin is plain ESM with no build step (that is deliberate - see
# docs/authoring.md "No build"), every test runs on the Node standard library
# (`node --test`), and the verify gate below is a dependency-free script. `git
# clone && npm test` therefore works before any package manager is involved.
#
# Nothing is published from here, to npm or anywhere else. A release is a
# `<package>-v<version>` git tag, and a consumer installs one subpackage with
#   git+https://github.com/chrisjohnson/dsh-plugins.git#<package>-v<version>&path:/packages/<dir>
# (pnpm's `&path:` selector is what lets one repository carry many plugins).
# See docs/releasing.md. For the local dev loop, see scripts/lab.mjs; the
# composition smoke (scripts/compose-smoke.mjs) installs each package into a
# real dsh profile.
packages:
  - 'packages/*'
